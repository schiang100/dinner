<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晚餐吃什麼？</title>
<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #f4f7f6; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    margin: 0; 
  }
  .container { 
    background: white; 
    padding: 30px; 
    border-radius: 12px; 
    box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
    text-align: center; 
    max-width: 400px; 
    width: 90%; 
  }
  h1 { color: #333; margin-bottom: 5px; }
  p { color: #666; margin-bottom: 20px; }
  
  .price-filters { 
    display: flex; 
    justify-content: space-between; 
    margin-bottom: 25px; 
  }
  .filter-btn { 
    flex: 1; 
    margin: 0 5px; 
    padding: 10px 5px; 
    border: 2px solid #007BFF; 
    background: white; 
    color: #007BFF; 
    border-radius: 8px; 
    cursor: pointer; 
    transition: 0.2s; 
    font-weight: bold;
  }
  .filter-btn.active { 
    background: #007BFF; 
    color: white; 
  }
  
  .action-btn { 
    background: #FF5722; 
    color: white; 
    border: none; 
    padding: 15px 30px; 
    font-size: 20px; 
    border-radius: 8px; 
    cursor: pointer; 
    width: 100%; 
    transition: 0.2s; 
    font-weight: bold; 
  }
  .action-btn:hover { background: #E64A19; }
  .action-btn:disabled { background: #ccc; cursor: not-allowed; }
  
  .result-box { 
    margin-top: 25px; 
    padding: 20px; 
    background: #e9ecef; 
    border-radius: 8px; 
    font-size: 24px; 
    font-weight: bold; 
    min-height: 40px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    color: #555; 
  }
</style>
</head>
<body>

<div class="container">
  <h1>🍔 晚餐吃什麼？</h1>
  <p>選擇你的預算，交給命運決定！</p>
  
  <div class="price-filters">
    <button class="filter-btn active" data-price="low">銅板價<br>(<100元)</button>
    <button class="filter-btn" data-price="mid">吃好點<br>(100-200元)</button>
    <button class="filter-btn" data-price="high">財富自由<br>(200元+)</button>
  </div>
  
  <button class="action-btn" id="drawBtn">幫我決定！</button>
  
  <div class="result-box" id="result">等待抽籤...</div>
</div>

<script>
  // 1. 建立餐廳資料庫 (可以自己隨意新增修改)
  const restaurants = [
    { name: "巷口陽春麵", price: "low" },
    { name: "超商微波便當", price: "low" },
    { name: "水餃10顆", price: "low" },
    { name: "肉燥飯+貢丸湯", price: "low" },
    
    { name: "麥當勞套餐", price: "mid" },
    { name: "平價小火鍋", price: "mid" },
    { name: "日式豚骨拉麵", price: "mid" },
    { name: "豐盛雞腿便當", price: "mid" },
    
    { name: "高級牛排館", price: "high" },
    { name: "無菜單日料", price: "high" },
    { name: "豪華海鮮吃到飽", price: "high" },
    { name: "老乾杯燒肉", price: "high" }
  ];

  let selectedPrice = "low"; // 預設為銅板價

  // 2. 處理價位按鈕點擊事件
  const filterBtns = document.querySelectorAll('.filter-btn');
  filterBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      // 移除所有按鈕的 active 樣式
      filterBtns.forEach(b => b.classList.remove('active'));
      // 幫點擊的按鈕加上 active 樣式
      e.currentTarget.classList.add('active');
      // 更新選擇的價位
      selectedPrice = e.currentTarget.getAttribute('data-price');
      // 重置結果區
      document.getElementById('result').innerHTML = "等待抽籤...";
    });
  });

  // 3. 處理抽籤邏輯與動畫
  const drawBtn = document.getElementById('drawBtn');
  const resultBox = document.getElementById('result');

  drawBtn.addEventListener('click', () => {
    // 篩選出符合價位的餐廳
    const filtered = restaurants.filter(r => r.price === selectedPrice);
    
    if (filtered.length === 0) {
      resultBox.textContent = "此價位沒有餐廳 😢";
      return;
    }

    // 防止連點
    drawBtn.disabled = true;
    
    let count = 0;
    const maxCount = 20; // 抽籤動畫跳動次數
    const interval = 60; // 每次跳動間隔毫秒

    // 抽籤跳動動畫
    const animation = setInterval(() => {
      const randomIdx = Math.floor(Math.random() * filtered.length);
      resultBox.textContent = filtered[randomIdx].name;
      count++;

      // 動畫結束，秀出最終結果
      if (count >= maxCount) {
        clearInterval(animation);
        const finalIdx = Math.floor(Math.random() * filtered.length);
        resultBox.innerHTML = `<span style="color:#FF5722; font-size:28px;">🎉 ${filtered[finalIdx].name} 🎉</span>`;
        drawBtn.disabled = false;
      }
    }, interval);
  });
</script>

</body>
</html>
